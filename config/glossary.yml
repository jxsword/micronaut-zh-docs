# ---- 模块专属术语（DR-006 M4：glossary 作用域设计）----
# 术语带 module: <site> 标注；validate ③ 扫描集 = 通用 terms + 当前模块术语，
# core 批次不含模块专属术语（防跨模块回流，B22 教训）。
# 新术语纪律：翻译中发现先写回本节再继续（PLAN §5.1 第 3 步）。
modules:
  terms:
    - en: "reporter"
      zh: "上报器"
      module: "micrometer"
      status: "approved"
      context: "micrometer 全模块高频（MICRO-01/02 实译；registry/reporter 分别译注册表/上报器）"
      aliases: ["reporters"]

    - en: "Observation"
      zh: "Observation"
      module: "micrometer"
      status: "approved"
      context: "不译；Micrometer Observation API 名（observation.adoc，observation 小写泛指时随语境）"
      aliases: ["observations"]

    - en: "constraint"
      zh: "约束"
      module: "validation"
      status: "approved"
      context: "validation 全模块高频（VALID-01 实译；constraint violation=约束违反）"
      aliases: ["constraints"]

    - en: "Authentication Provider"
      zh: "认证提供者"
      module: "security"
      status: "approved"
      context: "security 全模块高频（SEC-01 实译；provider 单独出现亦译提供者）"
      aliases: ["authentication providers", "AuthenticationProvider"]

    - en: "Authentication Fetcher"
      zh: "认证获取器"
      module: "security"
      status: "approved"
      context: "security 高频（SEC-01 实译；从请求中获取认证信息的组件）"
      aliases: ["authentication fetchers", "AuthenticationFetcher"]

    - en: "Token Reader"
      zh: "令牌读取器"
      module: "security"
      status: "approved"
      context: "security 高频（SEC-01 实译；Bearer/Cookie 令牌读取器）"
      aliases: ["token readers", "TokenReader"]

    - en: "Token Validator"
      zh: "令牌校验器"
      module: "security"
      status: "approved"
      context: "security 高频（SEC-01 实译；validate 语境统一「验证」，validate 签名=验证）"
      aliases: ["token validators", "TokenValidator"]

    - en: "Login Handler"
      zh: "登录处理器"
      module: "security"
      status: "approved"
      context: "security 高频（SEC-01 实译；LoginHandler 不译）"
      aliases: ["login handlers", "LoginHandler"]

    - en: "Logout Handler"
      zh: "登出处理器"
      module: "security"
      status: "approved"
      context: "security 高频（SEC-01 实译；LogoutHandler 不译）"
      aliases: ["logout handlers", "LogoutHandler"]

    - en: "Security Rule"
      zh: "安全规则"
      module: "security"
      status: "approved"
      context: "security 高频（SEC-01 实译；SecurityRule 不译）"
      aliases: ["security rules", "SecurityRule"]

    - en: "Claims"
      zh: "Claims"
      module: "security"
      status: "approved"
      context: "不译；JWT Claims 三段名（Header/Claims/Signature）之一（SEC-01 实译）"
      aliases: ["claims"]

    - en: "Intercept URL Map"
      zh: "Intercept URL Map"
      module: "security"
      status: "approved"
      context: "不译；官方安全规则配置名（SEC-01 实译；正文首次出现加「（拦截 URL 映射）」括注）"
      aliases: ["intercept url map"]

    - en: "sanitizer"
      zh: "净化器"
      module: "security"
      status: "approved"
      context: "security HTML Sanitizer 节（SEC-02 实译；OWASP Java HTML Sanitizer 产品名不译）"
      aliases: ["sanitizers"]

    - en: "token propagation"
      zh: "令牌传播"
      module: "security"
      status: "approved"
      context: "security Token Propagation 节（SEC-02 实译；TokenPropagationHttpClientFilter 等类名不译）"
      aliases: ["propagation"]

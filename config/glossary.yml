# Micronaut 中文翻译术语表（glossary.yml）
# 结构：terms（en/zh/status/context/aliases）+ banned（禁用译名黑名单）
# 规则（计划 §6）：
#   - 术语表为唯一来源；翻译中滚动修订，先写回再继续（§5.1 第 3 步）
#   - API 名/类名/注解/配置 key/flag 不译；术语首现括注原文
#   - banned 由 validate ③ 机器扫描（0 命中硬门禁）
#   - status: approved / provisional（provisional 条目批次复核后转正）


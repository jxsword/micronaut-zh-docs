# PR/push 门禁：pytest + validate + 清单冒烟（PLAN §7）
# 远程仓库建立前 workflows 仅为预备件；本地门禁以直接运行 scripts/ 校验命令为准
name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml pytest

      - name: pytest
        run: python3 -m pytest tests/ -q

      - name: validate translation (empty library must pass)
        run: python3 scripts/validate_translation.py

      - name: validate module manifests（DR-006：manifests/*.yml 逐账本校验）
        run: |
          set -e
          shopt -s nullglob
          for m in manifests/*.yml; do
            python3 scripts/validate_translation.py --manifest "$m"
          done

      - name: module manifest smoke check（DR-006：模块账本 schema/ref 冒烟）
        run: |
          set -e
          shopt -s nullglob
          for m in manifests/*.yml; do
            python3 - "$m" <<'PY'
          import yaml, sys
          p = sys.argv[1]
          m = yaml.safe_load(open(p))
          assert m.get("schema") == "v1", f"{p}: schema must be v1"
          assert isinstance(m.get("files"), list), f"{p}: files must be a list"
          assert m.get("ref"), f"{p}: module manifest must record ref (DR-006)"
          assert m.get("locked_at"), f"{p}: module manifest must record locked_at"
          print(f"module manifest smoke: {p} = {len(m['files'])} entries, ref={m['ref']}")
          PY
          done

      - name: manifest smoke check
        run: |
          python3 - <<'PY'
          import yaml, sys
          m = yaml.safe_load(open("manifest.yml"))
          assert m.get("schema") == "v1", "manifest schema must be v1"
          assert isinstance(m.get("files"), list), "manifest files must be a list"
          print(f"manifest smoke: {len(m['files'])} entries")
          if not m["files"]:
              print("manifest is empty (pre-init); smoke OK")
          PY

      - name: progress report smoke
        run: python3 scripts/progress.py

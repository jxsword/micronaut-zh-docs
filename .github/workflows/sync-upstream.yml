# 每周一 cron + 手动 dispatch：check_all.sh 逐模块 --check（core + manifests/*.yml），
# 有变更逐模块开 issue（DR-006 §6 命名 [upstream-sync][<site>]；core 沿用 [upstream-sync]）
name: sync-upstream

on:
  schedule:
    - cron: "0 2 * * 1"   # 每周一 UTC 02:00
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: check_all 逐模块同步检测（0=无变更 1=有变更 2=环境错误）
        id: check
        run: |
          set +e
          bash scripts/check_all.sh > /tmp/check-all.out 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/check-all.out
          test "$code" -le 1

      - name: open issues on changes（逐模块开 issue，DR-006 §6）
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          jq -c 'select(.code == 1)' reports/check-all-latest.jsonl | while IFS= read -r row; do
            site=$(echo "$row" | jq -r .site)
            sha8=$(echo "$row" | jq -r .sha8)
            if [ "$site" = "core" ]; then
              title="[upstream-sync] ${sha8}: 同步待处理"
            else
              title="[upstream-sync][${site}] ${sha8}: 同步待处理"
            fi
            gh issue create \
              --title "$title" \
              --body "check_all.sh 对照该模块账本 ref 的上游 HEAD 检出变更（退出码 1）。按 DR-006 §6：core 增量复译优先于模块新批次（issue 48h 目标响应）；批次冻结窗口内不处理。处理路径：sync --apply → 增量工作项 → PLAN §5.1 修订批次（只重译变更段）→ validate 全绿 → --mark-current → squash commit。变更清单见本次 workflow 日志（/tmp/check-all.out 已打印于上方步骤）。"
          done

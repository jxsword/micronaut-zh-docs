# 每周一 cron + 手动 dispatch；初译期（v1.0 tag 前）--apply 门控禁用，只开 issue（PLAN §4.4/§7）
# 远程仓库建立前 workflows 仅为预备件；本地门禁以直接运行脚本为准
name: sync-upstream

on:
  schedule:
    - cron: "0 2 * * 1"   # 每周一 UTC 02:00
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: sync --check（1=有变更 2=环境错误）
        id: check
        run: |
          set +e
          python3 scripts/sync_upstream.py --check --ref 5.2.x \
            > /tmp/sync.out 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          last=$(tail -n 1 /tmp/sync.out)
          echo "summary=$last" >> "$GITHUB_OUTPUT"
          cat /tmp/sync.out
          test "$code" -le 1

      - name: open issue on changes（初译期只开 issue，PLAN §4.4）
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sha8=$(python3 -c "import json; d=json.loads('${{ steps.check.outputs.summary }}'.splitlines()[-1] or '{}'); print(d.get('commit','?')[:8])" 2>/dev/null || echo "unknown")
          gh issue create \
            --title "[upstream-sync] ${sha8}: 同步待处理" \
            --body "sync --check 对照 5.2.x 分支 HEAD 检出上游变更（退出码 1）。初译期（v1.0 tag 前）--apply 门控禁用，按 PLAN §4.4 只开 issue；批次冻结窗口内不处理。变更清单见本次 workflow 日志（/tmp/sync.out 输出已打印于上方步骤）。"
